<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed variant for maskable / home-screen icons: no corner radius, artwork inside the safe zone. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="95%">
      <stop offset="0" stop-color="#2a2540"/>
      <stop offset="0.55" stop-color="#121219"/>
      <stop offset="1" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="0.55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2fd4ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <rect x="160" y="112" width="192" height="122" rx="28" fill="#fff" fill-opacity="0.12"/>
    <rect x="128" y="142" width="256" height="160" rx="34" fill="#fff" fill-opacity="0.2"/>
    <rect x="104" y="208" width="304" height="190" rx="40" fill="url(#card)" opacity="0.55" filter="url(#glow)"/>
    <rect x="96" y="176" width="320" height="200" rx="40" fill="url(#card)"/>
    <rect x="96" y="176" width="320" height="200" rx="40" fill="url(#sheen)"/>
    <path d="M228 230.5v91a9 9 0 0 0 13.6 7.7l75.3-45.5a9 9 0 0 0 0-15.4l-75.3-45.5a9 9 0 0 0-13.6 7.7Z" fill="#fff"/>
  </g>
</svg>
